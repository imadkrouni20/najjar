<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>النجّار الذكي</title>
<style>
:root{--bg:#0e1116;--bg2:#151a22;--panel:#1b212b;--line:#28303c;--txt:#e8edf5;--mut:#8a93a3;--acc:#ffb545;--acc2:#4ea8ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:-apple-system,"Segoe UI",Tahoma,system-ui,sans-serif;user-select:none}
#app{position:fixed;inset:0}
canvas{display:block;touch-action:none}
.topbar{position:absolute;top:0;inset-inline:0;height:52px;display:flex;align-items:center;gap:8px;padding:0 10px;background:linear-gradient(180deg,rgba(14,17,22,.95),rgba(14,17,22,.6));backdrop-filter:blur(8px);z-index:20;border-bottom:1px solid var(--line)}
.logo{font-weight:800;font-size:16px;color:var(--acc)}
.modes{display:flex;gap:4px;margin-inline-start:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px}
.modes button{background:transparent;border:0;color:var(--mut);font-weight:700;padding:7px 12px;border-radius:9px;font-size:12px}
.modes button.on{background:var(--acc);color:#111}
.dock{position:absolute;bottom:16px;inset-inline-start:50%;transform:translateX(50%);display:flex;gap:10px;z-index:20}
.dock .fbtn{width:56px;height:56px;border-radius:18px;background:var(--panel);border:1px solid var(--line);color:var(--txt);font-size:22px;display:grid;place-items:center;box-shadow:0 10px 26px rgba(0,0,0,.5);position:relative}
.dock .fbtn:active{transform:scale(.94)}
.dd{position:absolute;bottom:70px;inset-inline-start:50%;transform:translateX(50%) translateY(8px);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:8px;display:grid;gap:6px;min-width:200px;opacity:0;pointer-events:none;transition:.18s;box-shadow:0 14px 40px rgba(0,0,0,.55);z-index:30}
.dd.open{opacity:1;pointer-events:auto;transform:translateX(50%) translateY(0)}
.dd .row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;background:var(--bg2);font-size:13px;font-weight:600}
.dd .row:active{background:#242c38}
.dd .row .ic{font-size:18px;width:22px;text-align:center}
.side{position:absolute;top:52px;bottom:0;inset-inline-end:0;width:min(320px,86vw);background:var(--panel);border-inline-start:1px solid var(--line);z-index:25;transform:translateX(100%);transition:.25s;overflow-y:auto;padding:14px}
.side.open{transform:none}
.side h3{margin:6px 0 10px;font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:1px}
.prop{margin-bottom:12px}
.prop label{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-bottom:5px}
.prop input[type=range]{width:100%;accent-color:var(--acc)}
.prop .val{color:var(--acc);font-weight:700}
.btn{width:100%;padding:11px;border-radius:11px;border:1px solid var(--line);background:var(--bg2);color:var(--txt);font-weight:700;font-size:13px;margin-bottom:8px}
.btn.danger{background:#3a1d1d;border-color:#5a2a2a;color:#ffb3b3}
.gallery{position:absolute;inset:52px 0 0 0;overflow-y:auto;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;z-index:15;background:var(--bg)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.card .thumb{height:110px;background:radial-gradient(circle at 30% 20%,#2a3340,#141922);position:relative}
.card .thumb canvas{width:100%;height:100%;display:block}
.card .meta{padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.card .name{font-weight:800;font-size:13px}
.card .sub{font-size:11px;color:var(--mut)}
.card .actions{display:flex;gap:6px;padding:0 10px 10px}
.card .actions button{flex:1;padding:8px;border-radius:9px;border:1px solid var(--line);background:var(--bg2);color:var(--txt);font-weight:700;font-size:11px}
.card .actions .go{background:var(--acc);color:#111;border-color:var(--acc)}
.pvbar{position:absolute;bottom:16px;inset-inline-start:50%;transform:translateX(50%);display:flex;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:8px;z-index:20;max-width:92vw;overflow-x:auto}
.pvbar button{background:var(--bg2);border:1px solid var(--line);color:var(--txt);padding:9px 12px;border-radius:10px;font-weight:700;font-size:12px;white-space:nowrap}
.pvbar button.on{background:var(--acc2);color:#111;border-color:var(--acc2)}
.toast{position:absolute;top:66px;inset-inline-start:50%;transform:translateX(50%) translateY(-12px);background:var(--panel);border:1px solid var(--line);padding:9px 14px;border-radius:11px;font-size:12px;font-weight:700;opacity:0;transition:.25s;z-index:60;pointer-events:none}
.toast.show{opacity:1;transform:translateX(50%) translateY(0)}
.hide{display:none!important}
.gallery{align-content:start;grid-auto-rows:min-content}.card{height:auto;min-height:0}.card .name,.card .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;display:block}.card .actions{padding:8px 10px 10px}.card .actions button{padding:10px 6px;font-size:11px}</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="logo">🪚 النجّار الذكي</div>
    <div class="modes">
      <button data-mode="gallery" class="on">المعرض</button>
      <button data-mode="editor">المحرر</button>
      <button data-mode="preview">معاينة</button>
    </div>
  </div>
  <div id="gallery" class="gallery"></div>
  <div id="dock" class="dock hide">
    <button class="fbtn" id="btnAdd">➕
      <div class="dd" id="ddAdd">
        <div class="row" data-add="wardrobe"><span class="ic">🚪</span>خزانة ملابس</div>
        <div class="row" data-add="kitchen"><span class="ic">🍳</span>مطبخ سفلي</div>
        <div class="row" data-add="shelf"><span class="ic">📚</span>رفوف</div>
        <div class="row" data-add="table"><span class="ic">🪑</span>طاولة</div>
        <div class="row" data-add="doorUnit"><span class="ic">🚪</span>باب خشب</div>
        <div class="row" data-add="window"><span class="ic">🪟</span>نافذة ألمنيوم</div>
      </div>
    </button>
    <button class="fbtn" id="btnColor">🎨
      <div class="dd" id="ddColor">
        <div class="row" data-color="oak"><span class="ic">🟫</span>بلوط طبيعي</div>
        <div class="row" data-color="walnut"><span class="ic">🟤</span>جوز داكن</div>
        <div class="row" data-color="white"><span class="ic">⬜</span>أبيض ملمع</div>
        <div class="row" data-color="black"><span class="ic">⬛</span>أسود مطفي</div>
        <div class="row" data-color="alu"><span class="ic">🔩</span>ألمنيوم</div>
        <div class="row" data-color="glass"><span class="ic">🪟</span>زجاج</div>
      </div>
    </button>
    <button class="fbtn" id="btnTools">🔧
      <div class="dd" id="ddTools">
        <div class="row" data-tool="dup"><span class="ic">⧉</span>تكرار</div>
        <div class="row" data-tool="del"><span class="ic">🗑️</span>حذف</div>
        <div class="row" data-tool="rot"><span class="ic">🔄</span>وضع الدوران</div>
        <div class="row" data-tool="trn"><span class="ic">✥</span>وضع التحريك</div>
      </div>
    </button>
    <button class="fbtn" id="btnProps">⚙️</button>
    <button class="fbtn" id="btnSave">💾</button>
  </div>
  <aside id="side" class="side">
    <h3>خصائص العنصر</h3>
    <div id="props"></div>
    <button class="btn danger" id="delSel">حذف العنصر</button>
    <button class="btn" id="closeSide">إغلاق</button>
  </aside>
  <div id="pvbar" class="pvbar hide"></div>
  <div id="toast" class="toast"></div>
</div>
<script type="importmap">
{"imports":{
  "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
